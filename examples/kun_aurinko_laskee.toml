# "Kun aurinko laskee" — a western cue for the book of the same name.
# Sunset over the desert, two people at a campfire, a quiet threat in
# the air. D minor, slow, sparse. Harmonica alone from a distance, then
# steel guitar with low strings, a slow build toward the chorus, a break
# before the last rise, and the sun going down. Four-bar phrases with a
# breath between them; the tension never turns grand, only watchful.

