# Piano concerto in the spirit of Tchaikovsky's first, second attempt.
# Six sections, one theme. D-flat major maestoso in 3/4 with horns over
# piano octaves; a piano cadenza in B-flat minor with sweeping
# figuration; a lyrical second theme in F major on strings; a storm in
# C minor with brass; the maestoso theme returning tutti; and the piano
# alone at the end. Bridges carry every modulation; every later section
# borrows the maestoso theme.

