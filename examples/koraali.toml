# Chorale and variations in Bach's chorale idiom. The chorale itself is
# engine-made (four phrases of even quarters, a fermata at every phrase
# end, organ over held chords), followed by three baroque variations on
# its opening motif: harpsichord figuration, running piano figuration,
# and the chorale returning with brass.

name = "Koraali ja variaatiot"

