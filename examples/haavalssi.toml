# Wedding waltz in the spirit of a ballroom waltz from a fairy-tale
# ballet. B-flat major, tempo di valse. Strings open with a pickup-laden
# theme over pizzicato oom-pah-pah, the whole string section takes the
# theme, a horn trio in E-flat, the grand return with brass and timpani,
# and a coda that spins to a stop.

