# Happy Birthday as a tango. The tune is re-metred into 4/4 with the
# pickup on the last beat; bandoneon alternates habanera, marcato and
# 3-3-2 figures so no two bars comp the same way; the bass walks down
# chromatically at phrase ends. A generated D minor variation in the
# middle, then the tune returns with strings and a big ending.

name = "Tango de cumpleaños"

