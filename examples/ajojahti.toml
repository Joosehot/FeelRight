# Western chase at 130 BPM. Galloping guitar with hoofbeats, contrabass
# on the beats, trumpet leading like a Morricone cue; harmonica takes the
# middle over the same gallop in the relative major; a short ambush
# where everything stops; then the chase again, faster, until the
# riders pull up at the end.

