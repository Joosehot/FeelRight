# Organ piece in the spirit of a sea-devil's theme: a music box begins a
# slow minor waltz alone, the pipe organ takes the tune in huge held
# chords, a darker middle in the subdominant minor with the organ's full
# weight, the tune returns with organ and music box together, and the
# music box is left alone to wind down.

