# "Juholle" — a small oratorio in Bach's manner, in the shape of a
# Christmas-Oratorio cantata: an opening chorus in D major with trumpets
# and timpani, a secco recitative over held continuo, an aria for oboe
# over baroque figuration, a four-square chorale for choir and organ,
# and the opening chorus returning to close. One theme runs through it.

