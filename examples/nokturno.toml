# Nocturne in E minor, four sections. My own pick of what the engine does
# best: 4/4, moderate tempo, a period theme, a real modulation, and a
# texture arc from strings to piano to full orchestra to a solo violin.

name = "Nokturno e-molli"

[[section]]
name = "A teema"
# Period: the question ends on a half cadence, the answer on the tonic.
chords = "Em Am B7 Em | C Am B7 Em | Em C G D | Am Em B7 Em"
key = "E:minor"
tempo = 84
bars = 16
seed = 19
instrument = "strings"
octave = 1
style = "orchestral"
form = "period"
tension = [0.2, 0.3, 0.4, 0.5, 0.4, 0.5, 0.6, 0.5, 0.4, 0.5, 0.7, 0.9, 0.7, 0.5, 0.3, 0.2]
bridge = 1

[[section]]
name = "B valo"
# Relative major, piano alone, lighter and a little faster; ends open on
# B7 to pull back to E minor.
chords = "G D Em C | G D C D | Em C G D | C D B7 B7"
key = "G:major"
tempo = 96
bars = 16
seed = 35
instrument = "piano"
octave = 1
