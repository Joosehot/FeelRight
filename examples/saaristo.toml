# Nordic archipelago ballad in the spirit of Finnish sea-and-island film
# themes. A minor verse over held strings, a chorus that opens into the
# relative major with a wide singing arch, a stormier second verse with
# brass under the voice, and the chorus once more with the whole
# orchestra, dying away on the sea.

